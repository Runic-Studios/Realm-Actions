name: 'Trigger Argo CD Sync'
description: 'Triggers an Argo CD application sync via the API'
inputs:
  argocd_server:
    description: 'Argo CD server URL'
    required: true
  argocd_app:
    description: 'Argo CD application name to sync'
    required: true
  argocd_token:
    description: 'Bearer token for Argo CD API authentication'
    required: true
  force:
    description: 'Force sync (delete and recreate resources)'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Trigger Argo CD sync
      shell: bash
      run: |
        if [ "${{ inputs.force }}" = "true" ]; then
          DATA='{"strategy": {"hook": {"force": true}}}'
        else
          DATA='{}'
        fi
        curl --fail --show-error --silent \
          -X POST \
          "${{ inputs.argocd_server }}/api/v1/applications/${{ inputs.argocd_app }}/sync" \
          -H "Authorization: Bearer ${{ inputs.argocd_token }}" \
          -H "Content-Type: application/json" \
          --data "$DATA"
